name: Cleanup old workflow runs

on:
  workflow_run:
    workflows: ["Process pushed APK and release notes"]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'fetch_apk.yml',
              status: 'completed'
            });

            // Keep only the latest run, delete all others
            const runsToDelete = runs.data.workflow_runs.slice(1);
            
            for (const run of runsToDelete) {
              console.log(`Deleting run ${run.id}`);
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }