name: Cleanup old workflow runs

on:
  workflow_run:
    workflows: ["Deploy Jekyll with GitHub Pages dependencies preinstalled"]
    types:
      - completed
      - failure
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, only log deletions without deleting (true/false)'
        required: false
        default: 'true'
      age:
        description: 'Age value (number) used with age_unit to define cutoff (default 24)'
        required: false
        default: '24'
      age_unit:
        description: 'Unit for age: minutes, hours, or days (default hours)'
        required: false
        default: 'hours'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than today
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          AGE: ${{ github.event.inputs.age || '24' }}
          AGE_UNIT: ${{ github.event.inputs.age_unit || 'hours' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = (process.env.DRY_RUN && process.env.DRY_RUN.toString().toLowerCase() === 'true');

            // Paginate through all workflow runs for the repository (all workflows)
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            console.log(`Found ${runs.length} workflow runs for the repository`);

            // Compute cutoff based on inputs: AGE and AGE_UNIT
            let ageVal = parseInt(process.env.AGE || '24', 10);
            if (isNaN(ageVal) || ageVal < 0) ageVal = 24;
            const ageUnit = (process.env.AGE_UNIT || 'hours').toString().toLowerCase();

            const cutoff = new Date();
            if (ageUnit === 'minutes') {
              cutoff.setMinutes(cutoff.getMinutes() - ageVal);
            } else if (ageUnit === 'hours') {
              cutoff.setHours(cutoff.getHours() - ageVal);
            } else { // days
              cutoff.setDate(cutoff.getDate() - ageVal);
            }

            console.log(`Cutoff (UTC): ${cutoff.toISOString()} (older than ${ageVal} ${ageUnit})`);

            for (const run of runs) {
              const runDate = new Date(run.created_at);

              console.log(`Checking run ${run.id} created at ${run.created_at}`);

              if (runDate < cutoff) {
                if (dryRun) {
                  console.log(`[DRY RUN] Would delete run ${run.id} from ${run.created_at}`);
                } else {
                  console.log(`Deleting run ${run.id} from ${run.created_at}`);
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  });
                }
              }
            }