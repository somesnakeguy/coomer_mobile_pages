name: Cleanup old workflow runs

on:
  workflow_run:
    workflows: ["Process pushed APK and release notes"]
    types:
      - completed
      - failure
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than today
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'fetch_apk.yml';

            // Paginate through all workflow runs for the workflow
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              per_page: 100
            });

            const today = new Date();
            console.log(`Today's date: ${today.toISOString().split('T')[0]}`);
            today.setHours(0, 0, 0, 0);

            for (const run of runs) {
              const runDate = new Date(run.created_at);
              runDate.setHours(0, 0, 0, 0);

              console.log(`Checking run ${run.id} from ${runDate.toISOString().split('T')[0]}`);

              if (runDate < today) {
                console.log(`Deleting run ${run.id} from ${run.created_at}`);
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              }
            }